name: Release

# One version bump in manifest.json drives both the HACS release and the
# Docker image publish. The docker job calls BuildAndPublish.yml directly
# because releases created with GITHUB_TOKEN don't emit events that trigger
# other workflows.
on:
  push:
    branches: [master]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Only run if this is not a tag push (avoid duplicate releases)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.check_tag.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/gabb_wireless/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

  docker:
    name: Publish Docker image
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    uses: ./.github/workflows/BuildAndPublish.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: v${{ needs.release.outputs.version }}
