name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        # The integration tests are independent of the MQTT publisher tests
        # in tests/ (which have their own dependencies), so install only what
        # the integration needs here.
        run: pip install ruff pytest-homeassistant-custom-component

      - name: Run linting
        run: ruff check custom_components/gabb_wireless tests_integration

      - name: Check translations in sync with strings.json
        run: |
          diff \
            <(python -m json.tool --sort-keys custom_components/gabb_wireless/strings.json) \
            <(python -m json.tool --sort-keys custom_components/gabb_wireless/translations/en.json) \
            || { echo "::error::strings.json and translations/en.json differ"; exit 1; }

      - name: Run integration tests
        run: pytest tests_integration --asyncio-mode=auto

  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version bumped
        run: |
          CURRENT_VERSION=$(jq -r .version custom_components/gabb_wireless/manifest.json)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "::error::Version $CURRENT_VERSION has not been bumped from latest release $LATEST_TAG"
            exit 1
          fi
          echo "Version check passed: $CURRENT_VERSION (latest: $LATEST_VERSION)"
