name: Publish Docker
# release: covers manually published releases. workflow_call: lets release.yml
# chain into this directly (releases created with GITHUB_TOKEN don't emit
# events that trigger other workflows). workflow_dispatch: manual backfill.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.4.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.4.0)"
        required: true
        type: string
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Packages
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/jaycollett/${{ github.event.repository.name }}:${{ inputs.tag || github.event.release.tag_name }}, ghcr.io/jaycollett/${{ github.event.repository.name }}:latest
            